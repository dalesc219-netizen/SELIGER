name: Index public Seliger forum reports
on:
  push:
    branches: [main]
    paths:
      - scan_rusfishing.py
      - .github/workflows/forum-index.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: seliger-forum-index
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check travel period
        id: window
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$(date -u +%Y%m%d)" -le 20261025 ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.window.outputs.active == 'true'
        with:
          python-version: '3.12'
      - name: Install HTML parser
        if: steps.window.outputs.active == 'true'
        run: python -m pip install beautifulsoup4
      - name: Index up to 25 pages per run
        if: steps.window.outputs.active == 'true'
        run: python scan_rusfishing.py --pages 25 --latest-page 248
      - name: Persist coverage and candidates
        if: steps.window.outputs.active == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forum_scan_state.json data/forum_candidates.json
          if ! git diff --cached --quiet; then
            git commit -m "data: index public Rusfishing forum candidates"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
