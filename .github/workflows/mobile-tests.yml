name: Mobile browser tests
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Browser portrait and landscape
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/seliger-web.log 2>&1 &
          node tests/mobile.cjs
