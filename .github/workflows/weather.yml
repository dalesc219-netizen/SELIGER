name: Save weather forecast
on:
  push:
    branches: [main]
    paths:
      - 'update_history.py'
      - '.github/workflows/weather.yml'
  schedule:
    - cron: '15 3,9,15,21 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python update_history.py
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/latest.json
          git diff --cached --quiet || (git commit -m "data: snapshot forecast" && git push)
