name: Build Seliger icons
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'favicon.svg'
      - 'scripts/render_icons.py'
      - '.github/workflows/icons.yml'
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow cairosvg
      - run: python scripts/render_icons.py
      - name: Commit icon assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add favicon-32.png apple-touch-icon.png icon-192.png icon-512.png
          git diff --cached --quiet || (git commit -m "assets: publish Seliger favicon and home screen icons" && git pull --rebase && git push)
