name: Verify SELIGER
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check mobile.js
      - name: Python syntax
        run: python -c "import ast,pathlib; ast.parse(pathlib.Path('update_history.py').read_text())"
      - name: Structure smoke tests
        run: node tests/smoke.mjs
