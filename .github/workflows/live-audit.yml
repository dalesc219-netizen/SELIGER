name: Audit published mobile site
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tests/live-audit.cjs'
      - '.github/workflows/live-audit.yml'
      - 'favicon.svg'
      - 'mobile.css'
      - 'mobile.js'
      - 'index.html'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - name: Allow Pages deployment to settle
        run: sleep 20
      - name: Test published GitHub Pages with phone viewports
        run: node tests/live-audit.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seliger-mobile-audit
          path: audit-artifacts/
          retention-days: 10
